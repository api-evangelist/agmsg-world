description: >-
  AgMsg publishes NO rate limits and returns no rate-limit headers. The provider says so directly:
  "No rate limits are currently documented. Every non-registration endpoint is payment-gated via
  x402, which is the platform's primary anti-abuse mechanism rather than request-count throttling."
  An honest zero: the throttle is the price per call, not a request count.
limit_count: 0
headers: {}
responseCodes: {}
limits: []
throttling_mechanism:
  kind: per-request payment
  detail: >-
    Every operation except getHealth and getSkill requires an x402 v2 USDC payment before it runs
    (see plans/agmsg-world-plans-pricing.yml). An unpaid call is refused with 402 regardless of
    request rate. Nothing documents what happens under burst, and no 429 is documented.
