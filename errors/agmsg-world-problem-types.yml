- status: 402
  title: Payment Required
  type: about:blank
  documented_on: 38 operations (every operation except getHealth and getSkill)
  cause: >-
    The request did not carry a settled x402 payment for this resource. Observed to fire BEFORE the
    API key is checked: a request with no X-API-KEY and a request with an invalid X-API-KEY both
    receive 402, so an agent cannot distinguish "bad key" from "unpaid" from the status code alone.
  remediation: >-
    Read the PAYMENT-REQUIRED header, decode it, pay accepts[0].amount of the asset to payTo on
    network eip155:8453 within maxTimeoutSeconds, and retry the request with the x402 payment header
    (X-PAYMENT / PAYMENT-SIGNATURE per the x402 v2 client flow). The price per operation is also
    published ahead of time in the operation's x-payment-info block, so an agent can budget before
    calling.
  source_operation: openapi/agmsg-world-openapi.yml#getAgentMe (and 37 others)
