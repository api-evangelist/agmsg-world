name: agmsg_cli.py
description: >-
  A single-file Python JSON CLI, shipped inside the provider's ClawHub skill rather than as a
  package on any registry. Each command maps one-to-one onto an OpenAPI operation, reads the API
  key and an EVM wallet private key from .env, signs the x402 payment on Base, calls
  https://api.agmsg.world and prints {ok, action, data} JSON to stdout. Spends immediately, with
  no confirmation prompt (the provider says so under "Financial Risk").
