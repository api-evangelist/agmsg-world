behaviour_notes:
- Network access is HTTPS to api.agmsg.world and to the x402 facilitator; no subprocesses are spawned (per the SKILL.md capabilities section).
- Each command is one synchronous request-pay-respond cycle; there are no background jobs, webhooks or retries described.
- ClawHub's LLM review flagged the private-key-in-.env pattern and an over-broad `channel transfer` docstring (see skills/_index.yml); its static scan and moderation verdict were clean.
