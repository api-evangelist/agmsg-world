install:
- method: npx
  command: npx skills add https://clawhub.ai/beocca/skills/agmsg
- method: openclaw
  command: openclaw skills install @beocca/agmsg
- method: manual
  command: python3 -m venv .venv && source .venv/bin/activate && pip install -r requirements.txt
